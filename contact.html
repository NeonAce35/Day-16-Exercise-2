        <nav>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>Have a question or want to work together? I'd love to hear from you.</p>

            <h3>Email</h3>
            <p><a href="mailto:neonace627@gmail.com">Send me an email</a></p>

            <h3>GitHub</h3>
            <p><a href="https://github.com/NeonAce35" target="_blank" rel="noopener">Visit my GitHub</a></p>

            <h3>LinkedIn</h3>
            <p><a href="https://www.linkedin.com/in/ikechukwu-oghali-ukpor-a3b11340b/" target="_blank" rel="noopener">Visit my LinkedIn</a></p>
        </section>
        <section>
            <h2>Send Me a Message</h2>

            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
